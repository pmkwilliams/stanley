<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corner Store</title>
<style>
  body { font: 15px Georgia, serif; margin: 0; color: #2b2b2b; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: #f6f1e7; }
  header .brand { font-size: 22px; color: inherit; text-decoration: none; }
  header form { flex: 1; }
  header input { width: 100%; max-width: 360px; padding: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 32px; }
  .card { border: 1px solid #e3dccd; padding: 16px; }
  .price { color: #7a5c2e; }
  .notice { margin: 16px 32px; padding: 10px; background: #eef7ee; }
  table { margin: 0 32px; border-collapse: collapse; }
  td { padding: 6px 12px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">Corner Store</a>
  <form role="search" id="search"><input type="search" name="q" aria-label="Search products" placeholder="Search products"></form>
  <a id="cartlink" href="#/cart">Cart</a>
</header>
<main id="app"></main>
<script>
const products = [
  { id: 'mug-blue', name: 'Blue ceramic mug', price: 14, blurb: 'Hand-glazed stoneware, 12 oz.' },
  { id: 'mug-red', name: 'Red ceramic mug', price: 14, blurb: 'Hand-glazed stoneware, 12 oz.' },
  { id: 'board', name: 'Walnut cutting board', price: 38, blurb: 'End-grain walnut, 14 × 10 in.' },
  { id: 'towel', name: 'Linen tea towel', price: 9, blurb: 'Stonewashed linen, natural.' },
  { id: 'kit', name: 'Pour-over coffee kit', price: 42, blurb: 'Dripper, filters and carafe.' },
  { id: 'jar', name: 'Glass storage jar', price: 12, blurb: 'Airtight, 1 litre.' },
]
const seed = { cart: [], orders: [], notice: '' }
let state = JSON.parse(localStorage.getItem('state') || 'null') || structuredClone(seed)
const save = () => localStorage.setItem('state', JSON.stringify(state))
save()
const money = (n) => `$${n.toFixed(2)}`
const count = () => state.cart.reduce((n, i) => n + i.qty, 0)
document.getElementById('search').onsubmit = (e) => {
  e.preventDefault()
  location.hash = `#/search/${encodeURIComponent(new FormData(e.target).get('q') || '')}`
}
function card(p) {
  return `<article class="card"><h3>${p.name}</h3><p>${p.blurb}</p><p class="price">${money(p.price)}</p><button data-add="${p.id}">Add to cart</button></article>`
}
function render() {
  document.getElementById('cartlink').textContent = `Cart (${count()})`
  const route = decodeURIComponent(location.hash.replace(/^#/, '') || '/')
  const app = document.getElementById('app')
  const notice = state.notice ? `<p class="notice" role="status">${state.notice}</p>` : ''
  if (route === '/cart') {
    document.title = 'Your cart – Corner Store'
    const rows = state.cart.map((i) => { const p = products.find((x) => x.id === i.id); return `<tr><td>${p.name}</td><td>× ${i.qty}</td><td>${money(p.price * i.qty)}</td><td><button data-remove="${p.id}">Remove</button></td></tr>` }).join('')
    const total = state.cart.reduce((n, i) => n + products.find((x) => x.id === i.id).price * i.qty, 0)
    app.innerHTML = `${notice}<h1 style="margin: 24px 32px">Your cart</h1>` + (state.cart.length
      ? `<table>${rows}</table><p style="margin: 16px 32px">Subtotal: ${money(total)}</p><p style="margin: 16px 32px"><button data-order>Place order</button> <a href="#/">Continue shopping</a></p>`
      : `<p style="margin: 0 32px">Your cart is empty. <a href="#/">Continue shopping</a></p>`)
  } else {
    const q = route.startsWith('/search/') ? route.slice(8).toLowerCase() : ''
    const shown = q ? products.filter((p) => (p.name + ' ' + p.blurb).toLowerCase().includes(q)) : products
    document.title = q ? `“${q}” – Corner Store` : 'Corner Store'
    app.innerHTML = `${notice}<h1 style="margin: 24px 32px 0">${q ? `Results for “${q}”` : 'Kitchen & home'}</h1><div class="grid">${shown.map(card).join('') || '<p>No products match.</p>'}</div>`
  }
  state.notice = ''
  save()
}
document.getElementById('app').onclick = (e) => {
  const add = e.target.closest('[data-add]')?.dataset.add
  const remove = e.target.closest('[data-remove]')?.dataset.remove
  if (add) {
    const line = state.cart.find((i) => i.id === add)
    if (line) line.qty++
    else state.cart.push({ id: add, qty: 1 })
    state.notice = `Added ${products.find((p) => p.id === add).name} to your cart.`
  }
  if (remove) state.cart = state.cart.filter((i) => i.id !== remove)
  if (e.target.closest('[data-order]')) {
    state.orders.push({ number: 1042 + state.orders.length, items: state.cart })
    state.cart = []
    state.notice = `Thanks! Order #${1041 + state.orders.length} is placed and will ship tomorrow.`
  }
  if (add || remove || e.target.closest('[data-order]')) { save(); render() }
}
window.addEventListener('hashchange', render)
render()
</script>
</body>
</html>
